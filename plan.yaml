# The intended VLAN state. The tool adds whatever is missing.
# Do NOT list VLAN 99, the SVIs, or SW1 Ethernet1/0 here: they belong to the
# manual baseline and the tool refuses a plan that touches them.
# Interface names are for IOL-L2. If the group moves to IOSvL2, change
# Ethernet0/x to GigabitEthernet0/x here (and only here).
vlans:
  - {id: 10, name: Sales}
  - {id: 20, name: IT}
  - {id: 30, name: Guest}
switches:
  SW1:
    access: {Ethernet0/3: 30}
    trunks: {Ethernet0/1: [10, 20, 30], Ethernet0/2: [10, 20, 30]}
  SW2:
    access: {Ethernet0/1: 10, Ethernet0/2: 20}
    trunks: {Ethernet0/0: [10, 20, 30]}
  SW3:
    access: {Ethernet0/1: 10, Ethernet0/2: 20, Ethernet0/3: 30}
    trunks: {Ethernet0/0: [10, 20, 30]}
